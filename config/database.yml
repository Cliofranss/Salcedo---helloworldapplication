default: &default
  adapter: mysql2
  encoding: utf8mb4
  username: <%= ENV.fetch("DATABASE_USERNAME", "rails") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "secret") %>
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  port: 3306
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: myhelloworldapplication_development

test:
  <<: *default
  database: myhelloworldapplication_test

production:
  <<: *default
  database: myhelloworldapplication_production
